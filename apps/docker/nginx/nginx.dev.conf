server {
    listen 80;

    # Common proxy headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    # Timeouts
    proxy_connect_timeout 60s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    # Buffer settings
    proxy_buffering off;
    proxy_request_buffering off;

    location / {
        proxy_pass http://frontend:3000;
    }

    location /admin {
        proxy_pass http://clinic-core:8000;
    }

    location /home {
        proxy_pass http://clinic-core:8000;
    }

    # No URI suffix on proxy_pass: nginx preserves the complete /api/reports/ path.
    location ^~ /api/reports/ {
        proxy_pass http://reporting-service:8001;
    }

    # Server-to-server endpoints are reachable only on the Docker network.
    location = /api/internal {
        return 404;
    }

    location ^~ /api/internal/ {
        return 404;
    }

    location /api/ {
        proxy_pass http://clinic-core:8000;
    }
}
