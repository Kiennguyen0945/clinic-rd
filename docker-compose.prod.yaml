# ============================
# Production Docker Compose
# ============================
# Các image backend và frontend đã được build và push lên Docker Hub
# từ CI pipeline (ci_backend.yaml, ci_frontend.yaml).
#
# Các biến môi trường cần có trong file .env:
#   POSTGRES_DB, POSTGRES_USER, POSTGRES_PASSWORD
#   DJANGO_DB_ENGINE=postgres
#   DJANGO_SUPERUSER_USERNAME, DJANGO_SUPERUSER_PASSWORD, DJANGO_SUPERUSER_EMAIL
#   POSTGRES_HOST=database
#   DOCKER_USERNAME=<docker-hub-username>
#   FRONTEND_TAG=<git-sha>, BACKEND_TAG=<git-sha>, REPORTING_TAG=<git-sha>
#   REPORTING_DB_NAME, REPORTING_DB_USER, REPORTING_DB_PASSWORD
#   REPORTING_DJANGO_SECRET_KEY, INTERNAL_SERVICE_TOKEN, CORE_JWT_SIGNING_KEY
# ============================

services:
  database:
    container_name: clinic_db_prod
    image: postgres:17.10-alpine3.23
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    container_name: clinic_backend_prod
    image: ${DOCKER_USERNAME}/my-clinic-app-backend:${BACKEND_TAG}
    env_file:
      - .env
    environment:
      - DB_ENGINE=postgres
      - POSTGRES_HOST=database
    volumes:
      - static_files:/apps/backend/productionfiles
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "/opt/venv/bin/python manage.py check --deploy"]
      # Tip: Add a lightweight health endpoint (e.g., /api/health/ returning 200)
      # and test it with: python manage.py health_check
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  reporting-db:
    container_name: reporting_db_prod
    image: postgres:17.10-alpine3.23
    environment:
      POSTGRES_DB: ${REPORTING_DB_NAME}
      POSTGRES_USER: ${REPORTING_DB_USER}
      POSTGRES_PASSWORD: ${REPORTING_DB_PASSWORD}
    volumes:
      - reporting_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  reporting-service:
    container_name: reporting_service_prod
    image: ${DOCKER_USERNAME}/my-clinic-app-reporting:${REPORTING_TAG}
    environment:
      REPORTING_DB_ENGINE: postgres
      REPORTING_DB_HOST: reporting-db
      REPORTING_DB_PORT: 5432
      REPORTING_DB_NAME: ${REPORTING_DB_NAME}
      REPORTING_DB_USER: ${REPORTING_DB_USER}
      REPORTING_DB_PASSWORD: ${REPORTING_DB_PASSWORD}
      REPORTING_DJANGO_SECRET_KEY: ${REPORTING_DJANGO_SECRET_KEY}
      CLINIC_CORE_URL: http://backend:8000
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      CORE_JWT_SIGNING_KEY: ${CORE_JWT_SIGNING_KEY}
      CORE_HTTP_TIMEOUT_SECONDS: ${CORE_HTTP_TIMEOUT_SECONDS:-10}
    depends_on:
      reporting-db:
        condition: service_healthy
      backend:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - /opt/venv/bin/python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health/', timeout=2)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  frontend:
    container_name: clininc_frontend_prod
    image: ${DOCKER_USERNAME}/my-clinic-app-frontend:${FRONTEND_TAG}
    ports:
      - "80:80"
    env_file:
      - .env
    volumes:
      - static_files:/usr/share/nginx/static
    depends_on:
      backend:
        condition: service_started
      reporting-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:80/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
  reporting_data:
  static_files:
