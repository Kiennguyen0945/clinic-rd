name: ci

on:
  push:
    branches:
      ["main"]
    paths:
      - 'apps/backend/**'
      - 'apps/frontend/**'
      - 'apps/docker/backend/Dockerfile.bprod'
      - 'apps/docker/frontend/Dockerfile.fprod'
      - 'apps/docker/nginx/**'
      - 'apps/backend/static/**'
  pull_request:
    branches:
      ["main"]
    paths:
      - 'apps/backend/**'
      - 'apps/frontend/**'
      - 'apps/docker/backend/Dockerfile.bprod'
      - 'apps/docker/frontend/Dockerfile.fprod'
      - 'apps/docker/nginx/**'
      - 'apps/backend/static/**'
  workflow_dispatch:

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      backend_changed: ${{ steps.detect.outputs.backend_changed }}
      frontend_changed: ${{ steps.detect.outputs.frontend_changed }}
      nginx_changed: ${{ steps.detect.outputs.nginx_changed }}
      backend_auth_changed: ${{ steps.detect.outputs.backend_auth_changed }}
      backend_appointment_changed: ${{ steps.detect.outputs.backend_appointment_changed }}
      backend_patient_changed: ${{ steps.detect.outputs.backend_patient_changed }}
      backend_shared_changed: ${{ steps.detect.outputs.backend_shared_changed }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Detect changed areas
        id: detect
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "backend_changed=true" >> "$GITHUB_OUTPUT"
            echo "frontend_changed=true" >> "$GITHUB_OUTPUT"
            echo "nginx_changed=true" >> "$GITHUB_OUTPUT"
            echo "backend_auth_changed=true" >> "$GITHUB_OUTPUT"
            echo "backend_appointment_changed=true" >> "$GITHUB_OUTPUT"
            echo "backend_patient_changed=true" >> "$GITHUB_OUTPUT"
            echo "backend_shared_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base_ref="${{ github.event.pull_request.base.sha }}"
            head_ref="${{ github.event.pull_request.head.sha }}"
          else
            base_ref="${{ github.event.before }}"
            head_ref="${{ github.sha }}"
          fi

          changed_files=$(git diff --name-only "$base_ref" "$head_ref")

          backend_changed=false
          frontend_changed=false
          nginx_changed=false
          backend_auth_changed=false
          backend_appointment_changed=false
          backend_patient_changed=false
          backend_shared_changed=false

          if printf '%s\n' "$changed_files" | grep -qE '^apps/backend/'; then
            backend_changed=true
          fi

          if printf '%s\n' "$changed_files" | grep -qE '^apps/frontend/|^apps/docker/frontend/Dockerfile\.fprod$'; then
            frontend_changed=true
          fi

          if printf '%s\n' "$changed_files" | grep -qE '^apps/docker/nginx/|^apps/backend/static/'; then
            nginx_changed=true
          fi

          if printf '%s\n' "$changed_files" | grep -qE '^apps/backend/auth_service/'; then
            backend_auth_changed=true
          fi

          if printf '%s\n' "$changed_files" | grep -qE '^apps/backend/appointment_service/'; then
            backend_appointment_changed=true
          fi

          if printf '%s\n' "$changed_files" | grep -qE '^apps/backend/patient_service/'; then
            backend_patient_changed=true
          fi

          if printf '%s\n' "$changed_files" | grep -qE '^apps/backend/(config|core)/|^apps/backend/custom_commands/|^apps/backend/manage\.py$|^apps/backend/requirements(\.dev)?\.txt$|^apps/backend/ruff\.toml$|^apps/backend/entrypoint\.sh$|^apps/docker/backend/Dockerfile\.bprod$'; then
            backend_shared_changed=true
          fi

          {
            echo "backend_changed=$backend_changed"
            echo "frontend_changed=$frontend_changed"
            echo "nginx_changed=$nginx_changed"
            echo "backend_auth_changed=$backend_auth_changed"
            echo "backend_appointment_changed=$backend_appointment_changed"
            echo "backend_patient_changed=$backend_patient_changed"
            echo "backend_shared_changed=$backend_shared_changed"
          } >> "$GITHUB_OUTPUT"

  backend:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.backend_changed == 'true'
    services:
      postgres:
        image: postgres:17.10-alpine3.23
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: db
          POSTGRES_HOST: localhost
        ports:
          - 5432:5432
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: |
            apps/backend/requirements.txt
            apps/backend/requirements_dev.txt
      - name: Install Backend Dependencies
        working-directory: apps/backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements_dev.txt
      - name: Ruff Check
        working-directory: apps/backend
        # Keep this identical to the documented local command. Disabling the
        # cache also avoids ownership conflicts with Docker bind mounts.
        run: python -m ruff check --no-cache .
      - name: Integration Test
        working-directory: apps/backend
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
          DJANGO_DB_ENGINE: postgres
          POSTGRES_DB: db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          BACKEND_AUTH_CHANGED: ${{ needs.detect-changes.outputs.backend_auth_changed }}
          BACKEND_APPOINTMENT_CHANGED: ${{ needs.detect-changes.outputs.backend_appointment_changed }}
          BACKEND_PATIENT_CHANGED: ${{ needs.detect-changes.outputs.backend_patient_changed }}
          BACKEND_SHARED_CHANGED: ${{ needs.detect-changes.outputs.backend_shared_changed }}
        run: |
          set -e

          test_targets=()

          if [ "$BACKEND_SHARED_CHANGED" = "true" ]; then
            test_targets=(auth_service patient_service appointment_service)
          else
            if [ "$BACKEND_AUTH_CHANGED" = "true" ]; then
              test_targets+=(auth_service)
            fi
            if [ "$BACKEND_PATIENT_CHANGED" = "true" ]; then
              test_targets+=(patient_service)
            fi
            if [ "$BACKEND_APPOINTMENT_CHANGED" = "true" ]; then
              test_targets+=(appointment_service)
            fi
          fi

          if [ ${#test_targets[@]} -eq 0 ]; then
            test_targets=(auth_service patient_service appointment_service)
          fi

          python manage.py check
          python manage.py migrate
          python -W error::RuntimeWarning \
                 -W error::DeprecationWarning \
                manage.py test "${test_targets[@]}"
      - name: Docker Hub Login
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Set up Docker Buildx
        if: github.event_name == 'push'
        uses: docker/setup-buildx-action@v4
      - name: Build and Push Docker Image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/docker/backend/Dockerfile.bprod
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/my-clinic-app-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Update Backend Tag Variable
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          gh variable set CURRENT_BACKEND_TAG --body "${{ github.sha }}"

  frontend:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend_changed == 'true'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: 'npm'
          cache-dependency-path: apps/frontend/package-lock.json
      - name: Install dependencies
        working-directory: apps/frontend
        run: npm ci
      - name: Lint Frontend
        working-directory: apps/frontend
        run: npm run lint
      - name: Run Tests
        working-directory: apps/frontend
        run: npm run test
      - name: Login Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Set up Docker Buildx
        if: github.event_name == 'push'
        uses: docker/setup-buildx-action@v4
      - name: Build and Push Frontend Image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/docker/frontend/Dockerfile.fprod
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/my-clinic-app-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Update Frontend Tag Variable
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          gh variable set CURRENT_FRONTEND_TAG --body "${{ github.sha }}"

  nginx:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.nginx_changed == 'true'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
      - name: Login Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Set up Docker Buildx
        if: github.event_name == 'push'
        uses: docker/setup-buildx-action@v4
      - name: Build and Push Nginx Image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/docker/nginx/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/my-clinic-app-nginx:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Update Nginx Tag Variable
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          gh variable set CURRENT_NGINX_TAG --body "${{ github.sha }}"
