name: ci frontend
on:
  push:
    branches:
      ["main"]
    paths:
    - 'apps/frontend/**'
    - 'apps/docker/frontend/Dockerfile.fprod'
  pull_request:
    branches:
      ["main"]
    paths:
    - 'apps/frontend/**'
    - 'apps/docker/frontend/Dockerfile.fprod'
  workflow_dispatch:
jobs:
  ci-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: 'npm'
          cache-dependency-path: apps/frontend/package-lock.json
      - name: Install dependencies
        working-directory: apps/frontend
        run: npm ci
      - name: Lint Frontend
        working-directory: apps/frontend
        run: npm run lint
      - name: Run Tests
        working-directory: apps/frontend
        run: npm run test
      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/docker/frontend/Dockerfile.fprod
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/my-clinic-app-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Update Frontend Tag Variable
        env:
            GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          gh variable set CURRENT_FRONTEND_TAG --body "${{ github.sha }}"
