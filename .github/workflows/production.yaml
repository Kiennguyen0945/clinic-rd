name: Deploy production

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: clinic-production
  cancel-in-progress: false

jobs:
  validate-release:
    runs-on: ubuntu-latest
    outputs:
      frontend_tag: ${{ steps.manifest.outputs.frontend_tag }}
      backend_tag: ${{ steps.manifest.outputs.backend_tag }}
      reporting_tag: ${{ steps.manifest.outputs.reporting_tag }}
    steps:
      - name: Validate release tag format
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]

      - name: Checkout tagged release
        uses: actions/checkout@v5

      - name: Validate release manifest
        id: manifest
        run: |
          bash .github/scripts/read-release-manifest.sh \
            "deploy/releases/${GITHUB_REF_NAME}.env" "$GITHUB_OUTPUT"

  deploy:
    needs: validate-release
    runs-on: clinic-production
    environment:
      name: production
    steps:
      - name: Checkout tagged release
        uses: actions/checkout@v5

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Create isolated production deployment directory
        env:
          DEPLOY_DIR: ${{ runner.workspace }}/clinic-production
        run: |
          mkdir -p "$DEPLOY_DIR"
          cp docker-compose.prod.yaml "$DEPLOY_DIR/docker-compose.prod.yaml"

      - name: Create production environment file
        env:
          DEPLOY_DIR: ${{ runner.workspace }}/clinic-production
          FRONTEND_TAG: ${{ needs.validate-release.outputs.frontend_tag }}
          BACKEND_TAG: ${{ needs.validate-release.outputs.backend_tag }}
          REPORTING_TAG: ${{ needs.validate-release.outputs.reporting_tag }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          REPORTING_DB_NAME: ${{ secrets.REPORTING_DB_NAME }}
          REPORTING_DB_USER: ${{ secrets.REPORTING_DB_USER }}
          REPORTING_DB_PASSWORD: ${{ secrets.REPORTING_DB_PASSWORD }}
          REPORTING_DJANGO_SECRET_KEY: ${{ secrets.REPORTING_DJANGO_SECRET_KEY }}
          INTERNAL_SERVICE_TOKEN: ${{ secrets.INTERNAL_SERVICE_TOKEN }}
          CORE_JWT_SIGNING_KEY: ${{ secrets.CORE_JWT_SIGNING_KEY }}
          DJANGO_DB_ENGINE: ${{ secrets.DJANGO_DB_ENGINE }}
          DJANGO_SUPERUSER_USERNAME: ${{ secrets.DJANGO_SUPERUSER_USERNAME }}
          DJANGO_SUPERUSER_PASSWORD: ${{ secrets.DJANGO_SUPERUSER_PASSWORD }}
          DJANGO_SUPERUSER_EMAIL: ${{ secrets.DJANGO_SUPERUSER_EMAIL }}
        run: |
          umask 077
          {
            printf 'POSTGRES_DB=%s\n' "$POSTGRES_DB"
            printf 'POSTGRES_USER=%s\n' "$POSTGRES_USER"
            printf 'POSTGRES_PASSWORD=%s\n' "$POSTGRES_PASSWORD"
            printf 'REPORTING_DB_NAME=%s\n' "$REPORTING_DB_NAME"
            printf 'REPORTING_DB_USER=%s\n' "$REPORTING_DB_USER"
            printf 'REPORTING_DB_PASSWORD=%s\n' "$REPORTING_DB_PASSWORD"
            printf 'REPORTING_DJANGO_SECRET_KEY=%s\n' "$REPORTING_DJANGO_SECRET_KEY"
            printf 'INTERNAL_SERVICE_TOKEN=%s\n' "$INTERNAL_SERVICE_TOKEN"
            printf 'CORE_JWT_SIGNING_KEY=%s\n' "$CORE_JWT_SIGNING_KEY"
            printf 'CORE_HTTP_TIMEOUT_SECONDS=10\n'
            printf 'DOCKER_USERNAME=%s\n' "$DOCKER_USERNAME"
            printf 'DJANGO_DB_ENGINE=%s\n' "$DJANGO_DB_ENGINE"
            printf 'DJANGO_SUPERUSER_USERNAME=%s\n' "$DJANGO_SUPERUSER_USERNAME"
            printf 'DJANGO_SUPERUSER_PASSWORD=%s\n' "$DJANGO_SUPERUSER_PASSWORD"
            printf 'DJANGO_SUPERUSER_EMAIL=%s\n' "$DJANGO_SUPERUSER_EMAIL"
            printf 'FRONTEND_TAG=%s\n' "$FRONTEND_TAG"
            printf 'BACKEND_TAG=%s\n' "$BACKEND_TAG"
            printf 'REPORTING_TAG=%s\n' "$REPORTING_TAG"
          } > "$DEPLOY_DIR/.env.next"

      - name: Pull release images
        env:
          DEPLOY_DIR: ${{ runner.workspace }}/clinic-production
        working-directory: ${{ runner.workspace }}/clinic-production
        run: >-
          docker compose --project-name clinic-rd --env-file .env.next
          -f docker-compose.prod.yaml pull

      - name: Preserve previous release and deploy
        env:
          DEPLOY_DIR: ${{ runner.workspace }}/clinic-production
        working-directory: ${{ runner.workspace }}/clinic-production
        run: |
          if [ -f .env ]; then
            cp .env .env.previous
          fi
          mv .env.next .env
          docker compose --project-name clinic-rd -f docker-compose.prod.yaml \
            up -d --wait --wait-timeout 120

      - name: Production smoke test
        run: |
          curl --fail --silent --show-error http://localhost/ > /dev/null
          reporting_status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            http://localhost/api/reports/dashboard/manager/)
          test "$reporting_status" = "401"

      - name: Restore previous release after a failed deployment
        if: failure()
        env:
          DEPLOY_DIR: ${{ runner.workspace }}/clinic-production
        working-directory: ${{ runner.workspace }}/clinic-production
        run: |
          if [ ! -f .env.previous ]; then
            echo "No previous release is recorded; manual recovery is required." >&2
            exit 1
          fi
          cp .env.previous .env
          docker compose --project-name clinic-rd -f docker-compose.prod.yaml \
            up -d --pull always \
            --wait --wait-timeout 120

      - name: Record successful release
        env:
          DEPLOY_DIR: ${{ runner.workspace }}/clinic-production
        run: printf '%s\n' "$GITHUB_REF_NAME" > "$DEPLOY_DIR/CURRENT_RELEASE"
