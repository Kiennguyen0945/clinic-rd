name: ci nginx
on:
  push:
    branches: ["main"]
    paths:
      - 'apps/docker/nginx/**'
      - 'apps/backend/static/**'
  pull_request:
    branches: ["main"]
    paths:
      - 'apps/docker/nginx/**'
      - 'apps/backend/static/**'
  workflow_dispatch:
jobs:
  ci-nginx:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and Push Nginx Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/docker/nginx/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/my-clinic-app-nginx:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Update Nginx Tag Variable
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          gh variable set CURRENT_NGINX_TAG --body "${{ github.sha }}"



        