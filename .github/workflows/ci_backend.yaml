name: ci backend
env:
  POSTGRES_HOST: localhost
  POSTGRES_PORT: 5432
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  POSTGRES_DB: db
on:
  push:
    branches:
      ["main"]
    paths:
        - 'apps/backend/**'
        - 'apps/docker/backend/Dockerfile.bprod'
  pull_request:
    branches:
      ["main"]
    paths:
        - 'apps/backend/**'
        - 'apps/docker/backend/Dockerfile.bprod'
  workflow_dispatch:
jobs:
  ci-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.10-alpine3.23
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: db
          POSTGRES_HOST: localhost
        ports:
          - 5432:5432
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: apps/backend/requirements.txt
      - name: Setup Python && Ruff Check
        working-directory: apps/backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff
          ruff check .
      - name: Intergration Test
        working-directory: apps/backend
        env:
          DJANGO_DB_ENGINE: postgres
        run: |
          python manage.py check
          python manage.py migrate
          python -W error::RuntimeWarning \
                 -W error::DeprecationWarning \
                manage.py test
      - name: Docker Hub Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/docker/backend/Dockerfile.bprod
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/my-clinic-app-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Update Backend Tag Variable
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          gh variable set CURRENT_BACKEND_TAG --body "${{ github.sha }}"
        
