services:
  clinic-core-db:
    container_name: clinic-core-db
    image: postgres:17.10-alpine3.23
    env_file:
      - ./.env
    volumes:
      - postgres_clinic_db:/var/lib/postgresql/data
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  clinic-core:
    container_name: clinic-core
    build:
      context: .
      dockerfile: ./apps/docker/backend/Dockerfile.bdev
    ports:
      - 8000:8000
    volumes:
      - static_prod:/apps/backend/productionfiles
      - ./apps/backend:/apps/backend
    depends_on:
      clinic-core-db:
        condition: service_healthy
    env_file:
      - ./.env
    environment:
      # Compose service names are resolvable as hostnames on its default network.
      POSTGRES_HOST: clinic-core-db
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-development-internal-token}
    entrypoint: ["sh", "/apps/backend/entrypoint.sh"]

  reporting-db:
    container_name: reporting-db
    image: postgres:17.10-alpine3.23
    environment:
      POSTGRES_DB: ${REPORTING_DB_NAME:-reporting_db}
      POSTGRES_USER: ${REPORTING_DB_USER:-reporting_user}
      POSTGRES_PASSWORD: ${REPORTING_DB_PASSWORD:-reporting_dev_password}
    volumes:
      - reporting_data:/var/lib/postgresql/data
    ports:
      - 5433:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  reporting-service:
    container_name: reporting-service
    build:
      context: .
      dockerfile: ./apps/docker/reporting/Dockerfile.dev
    ports:
      - 8001:8001
    volumes:
      - ./apps/reporting_service:/apps/reporting_service
    environment:
      REPORTING_DB_ENGINE: postgres
      REPORTING_DB_HOST: reporting-db
      REPORTING_DB_PORT: 5432
      REPORTING_DB_NAME: ${REPORTING_DB_NAME:-reporting_db}
      REPORTING_DB_USER: ${REPORTING_DB_USER:-reporting_user}
      REPORTING_DB_PASSWORD: ${REPORTING_DB_PASSWORD:-reporting_dev_password}
      REPORTING_DJANGO_SECRET_KEY: ${REPORTING_DJANGO_SECRET_KEY:-django-insecure-reporting-development-only}
      CLINIC_CORE_URL: http://clinic-core:8000
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-development-internal-token}
    depends_on:
      reporting-db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - /opt/venv/bin/python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health/', timeout=2)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    container_name: frontend
    build:
      context: .
      dockerfile: ./apps/docker/frontend/Dockerfile.fdev
    ports:
      - 3000:3000
    volumes:
      - ./apps/frontend:/apps/frontend
      - /apps/frontend/node_modules

  nginx:
    container_name: nginx
    build:
      context: .
      dockerfile: ./apps/docker/nginx/Dockerfile
    ports:
      - 80:80
    volumes:
      - static_prod:/apps/backend/productionfiles
      - ./apps/docker/nginx/nginx.dev.conf:/etc/nginx/conf.d/nginx.dev.conf:ro
    depends_on:
      - frontend
      - clinic-core

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin4_container
    profiles:
      - tools
    restart: always
    ports:
      - "8888:80"
    env_file:
      - ./.env
    volumes:
      - pgadmin-data:/var/lib/pgadmin

volumes:
  postgres_clinic_db:
  reporting_data:
  static_prod:
  pgadmin-data:
